name: ci

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Typecheck all scripts
        run: tools/typecheck.sh

      - name: Content schema + GameCore tests (includes bot on every level)
        run: tests/run.sh

      - name: Bot wins every level
        run: godot --headless --path . -s tools/balance.gd

      - name: Install export templates
        run: |
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The default package list includes the removed "tools" package, which
      # makes sdkmanager fail. Godot needs platform-tools and apksigner from
      # build-tools to sign the debug APK.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0"

      - name: Debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/ladang-riuh.apk
          ls -lh build/

      - uses: actions/upload-artifact@v4
        with:
          name: ladang-riuh-apk
          path: build/ladang-riuh.apk
